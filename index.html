function buildDonut(data,label){const entries=Object.entries(data).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);const total=entries.reduce((s,[,v])=>s+v,0);if(!total)return '<p>No public language data available.</p>';let offset=0;const palette=['#ffab43','#de83a8','#79d6c5','#e5cf54','#aa9ae8','#7fa0f0'];const slices=entries.map(([name,n],i)=>{const pct=n/total*100;const color=langColors[name]||palette[i%palette.length];const seg=`${color} ${offset}% ${offset+pct}%`;offset+=pct;return {name,n,pct,color,seg}});return `<div class="donut-wrap"><div class="donut" role="img" aria-label="Language distribution by repository count" style="background:conic-gradient(${slices.map(s=>s.seg).join(',')})"><div class="donut-center"><strong>${total}</strong><small>REPOS</small></div></div><div class="lang-legend">${slices.map(s=>`<div class="lang" title="${esc(s.name)}: ${s.n} repositories"><span class="lang-swatch" style="background:${s.color};color:${s.color}"></span><span class="label">${esc(s.name)}</span><b>${s.pct.toFixed(1)}%</b></div>`).join('')}</div></div><small class="note">${esc(label)} · repository counts, not code bytes or skill ratings.</small>`;}
